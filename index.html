<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interrogazioni</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <h1>🌸 Interrogazioni</h1>

    <h2>Nuova interrogazione</h2>

    <label for="materia">Materia</label>

    <input 
        type="text" 
        id="materia" 
        placeholder="Es. Spagnolo"
    >

    <button onclick="creaInterrogazione()">
        Crea
    </button>

    <h2 id="titoloInterrogazione"></h2>

    <div id="sezioneDate" style="display: none;">

        <h3>Date</h3>

        <input type="date" id="dataInterrogazione">

        <button onclick="aggiungiData()">
            Aggiungi data
        </button>

        <ul id="listaDate"></ul>

    </div>

    <script src="Script.js"></script>

</body>

</html>
