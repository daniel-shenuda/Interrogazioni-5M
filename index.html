<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interrogazioni</title>
  <style>
:root {
  --rosa: #ec4899;
  --rosa-scuro: #be185d;
  --rosa-chiaro: #fce7f3;
  --testo: #4a1d36;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--rosa-chiaro);
  color: var(--testo);
}
header {
  background: var(--rosa);
  color: #fff;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
h1 { margin: 0; font-size: 1.4rem; }
main { max-width: 800px; margin: 20px auto; padding: 0 16px; }
.card, .materia {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(190, 24, 93, .15);
}
h2, h3 { color: var(--rosa-scuro); }
input, textarea {
  padding: 8px;
  border: 1px solid #f9a8d4;
  border-radius: 8px;
  font: inherit;
}
textarea { width: 100%; margin-bottom: 8px; }
button {
  background: var(--rosa);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 8px 14px;
  font: inherit;
  cursor: pointer;
}
button:hover { background: var(--rosa-scuro); }
header button { background: #fff; color: var(--rosa-scuro); }
.grande { margin-top: 12px; padding: 12px 20px; font-weight: 600; }
.riga { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--rosa-chiaro); border-radius: 20px; padding: 4px 10px; cursor: pointer; }
.giorno { padding: 8px 0; border-top: 1px solid var(--rosa-chiaro); }
.giorno strong { text-transform: capitalize; }
.elimina { background: transparent; color: var(--rosa-scuro); border: 1px solid var(--rosa); }
summary { cursor: pointer; font-size: 1.1rem; font-weight: 600; color: var(--rosa-scuro); }
details[open] summary { margin-bottom: 8px; }
.elimina { margin-top: 10px; }

</style>
</head>
<body>
  <header>
    <h1>📚 Calendario Interrogazioni</h1>
    <button id="btnLogin">Accedi (solo rappresentante)</button>
  </header>

  <main>
    <section id="admin" class="card" hidden>
      <h2>Pannello rappresentante</h2>

      <h3>Compagni di classe</h3>
      <textarea id="studenti" rows="8" placeholder="Un nome per riga"></textarea>
      <button id="salvaStudenti">Salva nomi</button>

      <h3>Nuova materia</h3>
      <div class="riga">
        <input id="materia" placeholder="Materia (es. Storia)">
        <label>Persone al giorno <input type="number" id="perGiorno" value="4" min="1"></label>
      </div>
      <div class="riga">
        <input type="date" id="data">
        <button id="addData">+ Aggiungi data</button>
      </div>
      <div id="dateScelte" class="chips"></div>
      <button id="estrai" class="grande">🎲 Estrai e salva</button>
    </section>

    <section>
      <h2>Programma</h2>
      <div id="programma"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="Script.js"></script>
</body>
</html>
