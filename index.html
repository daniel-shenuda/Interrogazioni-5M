<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interrogazioni</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <header>
    <h1>📚 Calendario Interrogazioni</h1>
    <button id="btnLogin">Accedi (solo rappresentante)</button>
  </header>

  <main>
    <section id="admin" class="card" hidden>
      <h2>Pannello rappresentante</h2>

      <h3>Compagni di classe</h3>
      <textarea id="studenti" rows="8" placeholder="Un nome per riga"></textarea>
      <button id="salvaStudenti">Salva nomi</button>

      <h3>Nuova materia</h3>
      <div class="riga">
        <input id="materia" placeholder="Materia (es. Storia)">
        <label>Persone al giorno <input type="number" id="perGiorno" value="4" min="1"></label>
      </div>
      <div class="riga">
        <input type="date" id="data">
        <button id="addData">+ Aggiungi data</button>
      </div>
      <div id="dateScelte" class="chips"></div>
      <button id="estrai" class="grande">🎲 Estrai e salva</button>
    </section>

    <section>
      <h2>Programma</h2>
      <div id="programma"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="Script.js"></script>
</body>
</html>
